<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script type="text/javascript">
      window.onload = function () {
        kakidashi();
      };
      function setText(text) {
        const test1 = document.getElementById("test1");
        test1.innerHTML = text;
      }
      function kakidashi() {
        (function (newfunc) {
          var save = document.write;
          document.write = newfunc;
          document.write.reset = function () {
            document.write = save;
          };
        })(
          (function () {
            basyo = document.getElementById("kakidashi");
            return function (value) {
              basyo.innerHTML += value;
            };
          })()
        );
        document.write(document.getElementById("test1").innerHTML + "<br>");
        document.write.reset();
      }
    </script>
  </head>
  <body>
    <div id="test1">始め</div>
    <br />
    <a href="#" onclick="setText('終わり')">1</a>
    <div id="kakidashi"></div>
  </body>
</html>
