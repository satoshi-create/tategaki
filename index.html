<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css" />
  <title></title>
</head>

<body>

  <!-- toggle-text -->
  <div class="toggle-text">
    <p class="active-color">古文</p>
    <button type="button" class="btn toggle-text-btn">
      <span class="toggle-icon">
        <i class="fas fa-sync"></i>
      </span>
    </button>
    <p>現代語訳</p>
  </div>

  <!-- sidebarR -->
  <button class="sidebar-open-btn">
    <i class="fa-solid fa-ellipsis-vertical"></i>
  </button>
  <aside class="sidebar sidebarR">
    <button class="sidebar-close-btn">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <div class="colors">
      <button class="btn white" data-id="white"></button>
      <!-- <button class="btn gray" data-id="gray"></button> -->
      <button class="btn black" data-id="black"></button>
    </div>
    <div class="mokuji"></div>
  </aside>

  <!-- sidebarL -->
  <aside class="sidebar sidebarL">
    <button class="sidebar-close-btn">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <div class="sidebarL-word-box"></div>
  </aside>

  <!-- contents -->
  <div class="title"></div>
  <div class="container"></div>

</body>
<script src="js/jquery-2.2.4.min.js"></script>
<script src="js/jquery.mousewheel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-mousewheel/3.1.3/jquery.mousewheel.min.js"></script>
</script>
<script type="module" src="js/script.js"></script>
<script src="js/jquery.js"></script>

<script src="https://kit.fontawesome.com/a07a7ea817.js" crossorigin="anonymous"></script>

</html>
